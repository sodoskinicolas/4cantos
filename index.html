<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<script src="supabase.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>4Cantos · Painel 2026</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#0d0f14; --card:#161a22; --card2:#1d2230; --line:#252b38;
 --tx:#e8ecf3; --mut:#8b95a8; --grn:#34d399; --red:#f87171; --amb:#fbbf24; --blu:#60a5fa;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;max-width:100%}
body{padding-bottom:96px}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:30;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;max-width:760px;margin:0 auto}
.hd h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
.hd .yr{font-size:12px;color:var(--mut)}
.months{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 10px;max-width:760px;margin:0 auto;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);
 color:var(--mut);font-size:13px;font-weight:600}
.mchip.on{background:var(--tx);color:#0d0f14;border-color:var(--tx)}
.mchip.fut{opacity:.45}
h2.sec{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin:20px 2px 8px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
.kpi.big{grid-column:1/-1}.kpi.big .v{font-size:28px}
.g{color:var(--grn)}.r{color:var(--red)}.a{color:var(--amb)}.b{color:var(--blu)}.m{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.aphd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;gap:10px}
.aphd .n{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.aphd .sub{font-size:11px;color:var(--mut);margin-top:2px}
.aphd .rt{text-align:right}
.aphd .rt .v{font-weight:700;font-size:16px}
.chev{width:12px;height:12px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);
 transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s;flex:0 0 auto}
.chev.up{transform:rotate(-135deg) translate(-3px,-3px)}
.bar{height:5px;background:var(--card2);border-radius:9px;overflow:hidden;margin:0 14px 12px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .3s}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .info{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:11px;color:var(--mut);margin-top:1px}
.val{width:116px;text-align:right;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line);
 color:var(--tx);padding:8px 8px;border-radius:9px;font-family:inherit}
.val::placeholder{color:#4b5568;font-weight:600}
.val:focus{outline:0;border-color:var(--blu)}
.valro{width:116px;text-align:right;font-weight:700;font-size:15px}
.pill{flex:0 0 auto;min-width:70px;text-align:center;padding:8px 8px;border-radius:10px;font-size:11px;
 font-weight:700;border:1px solid var(--line);background:var(--card2);color:var(--mut);letter-spacing:.2px}
.pill.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.35);color:var(--grn)}
.pill.ko{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.3);color:var(--red)}
.pill.pa{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4);color:var(--amb)}
.sub-h{padding:9px 14px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);
 font-weight:700;background:var(--card2);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.txt{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-family:inherit;
 font-size:16px;font-weight:600;padding:9px 10px;border-radius:9px}
.txt:focus{outline:0;border-color:var(--blu)}
.txt.sm{font-size:16px;font-weight:600;flex:0 0 104px}
.del{flex:0 0 auto;width:36px;height:36px;border-radius:9px;background:rgba(248,113,113,.12);
 border:1px solid rgba(248,113,113,.25);color:var(--red);font-size:17px;font-weight:700;line-height:1;font-family:inherit}
.addbt{width:100%;padding:11px;background:var(--card2);border:1px dashed var(--line);color:var(--blu);
 font-size:13px;font-weight:700;font-family:inherit;border-radius:0}
.iconbt{flex:0 0 auto;padding:7px 10px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
 color:var(--mut);font-size:12px;font-weight:700;font-family:inherit}
.iconbt.on{color:var(--blu);border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.12)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
tr.tot td{font-weight:800;border-top:1px solid var(--line);border-bottom:0;font-size:15px}
tr.sb td{color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(13,15,20,.96);backdrop-filter:blur(12px);
 border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;color:var(--mut);padding:10px 2px 12px;font-family:inherit;
 font-size:10.5px;font-weight:700;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);
 color:var(--mut);font-size:13px;font-weight:600;font-family:inherit}
.seg button.on{background:var(--tx);color:#0d0f14;border-color:var(--tx)}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;padding:10px 12px 0}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.chart div b{display:block;background:var(--grn);border-radius:3px 3px 0 0;min-height:2px}
.chart div u{display:block;background:#374151;border-radius:0 0 3px 3px;min-height:2px}
.chartx{display:flex;gap:5px;padding:5px 12px 12px}
.chartx span{flex:1;text-align:center;font-size:9px;color:var(--mut)}
.tools{display:flex;gap:8px;margin:14px 0 4px}
.tools button{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);
 color:var(--tx);font-size:13px;font-weight:600;font-family:inherit}
.bigadd{width:100%;padding:14px;border-radius:12px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.35);
 color:var(--blu);font-size:14px;font-weight:700;font-family:inherit;margin-bottom:12px}
.note{font-size:11.5px;color:var(--mut);line-height:1.5;margin:10px 2px 0}
.hidden{display:none}
.ovl.hidden{display:none}
.ovl{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px}
.ovl .box{width:100%;max-width:400px}
.ovl h3{font-size:20px;margin:0 0 6px;letter-spacing:-.4px}
.ovl p{font-size:13px;color:var(--mut);line-height:1.5;margin:0 0 18px}
.ovl input{width:100%;padding:13px;margin-bottom:9px;border-radius:11px;background:var(--card);
 border:1px solid var(--line);color:var(--tx);font-size:16px;font-family:inherit}
.ovl input:focus{outline:0;border-color:var(--blu)}
.ovl button{width:100%;padding:14px;border-radius:11px;background:var(--blu);border:0;color:#0d0f14;
 font-size:15px;font-weight:700;font-family:inherit;margin-top:5px}
.ovl button.gh{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:600;font-size:13px}
.ovl .err{color:var(--red);font-size:12.5px;margin:10px 0 0;min-height:16px}
.sync{font-size:10px;color:var(--mut);letter-spacing:.4px;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--mut);display:block}
.sync.ok i{background:var(--grn)}.sync.busy i{background:var(--amb)}.sync.off i{background:var(--red)}
</style>
</head>

 if(/invalid login|invalid credentials/i.test(m))return 'E-mail ou senha incorretos. Se ainda não tem conta, toque em “Criar conta”.';
 if(/already registered|already been registered|user already|already exists/i.test(m))return 'Este e-mail já tem conta. Digite a senha e toque em “Entrar”.';
 if(/at least 6|password should|weak.?password/i.test(m))return 'A senha precisa ter ao menos 6 caracteres.';
 if(/not confirmed|email not confirmed/i.test(m))return 'Confirme seu e-mail pelo link que enviamos e depois toque em “Entrar”.';
 if(/valid email|invalid.?email|unable to validate email/i.test(m))return 'Digite um e-mail válido.';
 if(/rate|too many|seconds/i.test(m))return 'Muitas tentativas. Aguarde alguns segundos e tente de novo.';
 if(/anonymous/i.test(m))return 'Preencha o e-mail e a senha antes de continuar.';

 if(!c){setSync('','só neste aparelho');telaConfig();render();return;}
 setSync('busy','conectando…');
 if(!await lib()){setSync('off','sem conexão');render();return;}

 USER=session.user;ovl(null);setSync('busy','carregando…');

/* ---------- dinheiro ---------- */
const brl=n=>(n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const brl2=n=>(n<0?'-':'')+'R$ '+Math.abs(Math.round(n*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const inMoney=n=>n?brl2(n):'';
function maskEl(el){
 const neg=el.value.indexOf('-')>=0;
 const d=el.value.replace(/\D/g,'');
 if(!d){el.value=neg?'-':'';return;}
 el.value=(neg?'-':'')+'R$ '+(parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function parseMoney(s){
 const neg=String(s).indexOf('-')>=0;
 const d=String(s).replace(/\D/g,'');
 if(!d)return 0;
 return (neg?-1:1)*parseInt(d,10)/100;
}
/* aceita conta matemática no campo, ex.: 900+1000+300 */
function isExpr(s){s=String(s).replace(/R\$|\s/g,'');return /[+*/]/.test(s)||/\d-/.test(s);}
function evalExpr(e){
 if(!/^[0-9+\-*/().]+$/.test(e))return NaN;
 try{const r=Function('"use strict";return('+e+')')();return (typeof r==='number'&&isFinite(r))?r:NaN;}catch(_){return NaN;}
}
function parseNumBR(s){ // interpreta como REAIS: "1.850,50" -> 1850.5 ; "850" -> 850
 s=String(s); const neg=s.trim().indexOf('-')===0;
 s=s.replace(/R\$/g,'').replace(/\s/g,'').replace(/\./g,'').replace(/,/g,'.').replace(/[^0-9.]/g,'');
 const n=parseFloat(s); if(isNaN(n))return 0; return neg?-Math.abs(n):n;
}
function parseVal(s){
 s=String(s);
 if(isExpr(s)){
  const e=s.replace(/R\$/g,'').replace(/\s/g,'').replace(/\./g,'').replace(/,/g,'.');
  const r=evalExpr(e);
  return isNaN(r)?0:Math.round(r*100)/100;
 }
 return Math.round(parseNumBR(s)*100)/100;
}
function valInput(el){ el.value=el.value.replace(/[^0-9+\-*/().,\sR$]/g,''); }
function negToggle(el){ // permite lançar valor negativo (crédito/estorno)
 el.value = el.value.indexOf('-')>=0 ? el.value.replace('-','') : '-'+el.value;
}

/* ---------- cálculos ---------- */
function pagoVal(c){ return c.pago ? c.v : (c.pg>0 ? c.pg : 0); }
function statusPg(c){ return c.pago ? 'ok' : (c.pg>0 ? 'pa' : 'nao'); }
function apStats(ap,m){
 let rec=0,recPg=0,cus=0,cusPg=0,ocup=0;
 ap.quartos.forEach(q=>{const c=q.meses[m];rec+=c.v;recPg+=pagoVal(c);if(c.v>0)ocup++;});
 ap.custos.forEach(x=>{const c=x.meses[m];cus+=c.v;cusPg+=pagoVal(c);});
 return{rec,recPg,recAb:rec-recPg,cus,cusPg,cusAb:cus-cusPg,lucro:rec-cus,caixa:recPg-cusPg,ocup,
  marg:rec?(rec-cus)/rec:0};
}
function totStats(m){const t={rec:0,recPg:0,recAb:0,cus:0,cusPg:0,cusAb:0,lucro:0,caixa:0,ocup:0};
 DATA.forEach(ap=>{const s=apStats(ap,m);for(const k in t)t[k]+=s[k];});
 t.marg=t.rec?t.lucro/t.rec:0;return t;}
const hasData=m=>DATA.some(ap=>{const s=apStats(ap,m);return s.rec>0||s.cus>0;});
const totQuartos=()=>DATA.reduce((s,a)=>s+a.quartos.length,0);

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function toggleOpen(ai){OPEN[ai]=!OPEN[ai];if(!OPEN[ai])EDIT[ai]=false;render();}
function toggleEdit(ai){EDIT[ai]=!EDIT[ai];render();}
function cyclePg(t,ai,i){const o=t==='q'?DATA[ai].quartos[i]:DATA[ai].custos[i];const c=o.meses[MES];
 const st=statusPg(c);
 if(st==='nao'){c.pago=true;c.pg=0;}
 else if(st==='ok'){
  const ent=prompt('Quanto foi '+(t==='q'?'recebido':'pago')+' até agora? (pode usar conta, ex.: 300+200)', c.v?String(c.v):'');
  if(ent===null)return;
  const val=parseVal(ent);
  if(val<=0){c.pago=false;c.pg=0;}
  else if(val>=c.v){c.pago=true;c.pg=0;}
  else {c.pago=false;c.pg=val;}
 } else {c.pago=false;c.pg=0;}
 save();render(); if(navigator.vibrate)navigator.vibrate(8);}
function setV(t,ai,i,v){const o=t==='q'?DATA[ai].quartos[i]:DATA[ai].custos[i];
 o.meses[MES].v=parseVal(v);save();render();}
function baixaPend(t,ai,i,m,el){const o=t==='q'?DATA[ai].quartos[i]:DATA[ai].custos[i];
 o.meses[m].pago=true;o.meses[m].pg=0;save();
 if(el){el.classList.add('ok');el.textContent=t==='q'?'✓ RECEBIDO':'✓ PAGO';el.onclick=null;el.style.opacity='.75';}
 if(navigator.vibrate)navigator.vibrate(8);}

/* ---------- cadastro ---------- */
function blank(){const o={};MESES.forEach(m=>o[m]={v:0,pago:false});return o;}
function setApNome(ai,v){DATA[ai].nome=v.trim()||DATA[ai].nome;save();render();}
function setInq(ai,qi,v){DATA[ai].quartos[qi].inquilino=v.trim();save();render();}
function setQNome(ai,qi,v){DATA[ai].quartos[qi].quarto=v.trim()||('Quarto '+(qi+1));save();render();}
function setCNome(ai,ci,v){DATA[ai].custos[ci].nome=v.trim()||DATA[ai].custos[ci].nome;save();render();}
function addQ(ai){DATA[ai].quartos.push({quarto:'Quarto 0'+(DATA[ai].quartos.length+1),inquilino:'',meses:blank()});save();render();}
function delQ(ai,qi){if(confirm('Remover '+(DATA[ai].quartos[qi].inquilino||DATA[ai].quartos[qi].quarto)+'?')){DATA[ai].quartos.splice(qi,1);save();render();}}
function addC(ai){const n=prompt('Nome da despesa:','');if(n&&n.trim()){DATA[ai].custos.push({nome:n.trim(),meses:blank()});save();render();}}
function delC(ai,ci){if(confirm('Remover a despesa '+DATA[ai].custos[ci].nome+'?')){DATA[ai].custos.splice(ci,1);save();render();}}
function addAp(){
 const n=prompt('Nome do apartamento (ex.: 105 - Marieta):','');
 if(!n||!n.trim())return;
 const q=parseInt(prompt('Quantos quartos?','5')||'5',10)||5;
 const ap={id:'ap'+Date.now(),nome:n.trim(),quartos:[],custos:[]};
 for(let i=0;i<q;i++)ap.quartos.push({quarto:'Quarto 0'+(i+1),inquilino:'',meses:blank()});
 ['Aluguel','Condominio','Luz','Internet','Reformas'].forEach(c=>ap.custos.push({nome:c,meses:blank()}));
 DATA.push(ap);OPEN[DATA.length-1]=true;EDIT[DATA.length-1]=true;save();render();
}
function delAp(ai){if(confirm('Excluir '+DATA[ai].nome+' e todo o histórico dele?')){DATA.splice(ai,1);OPEN={};EDIT={};save();render();}}

/* ---------- DRE ---------- */
function dreOf(list,m){
 const r={receita:0,linhas:{},custo:0};
 list.forEach(ap=>{ap.quartos.forEach(q=>r.receita+=q.meses[m].v);
  ap.custos.forEach(x=>{r.linhas[x.nome]=(r.linhas[x.nome]||0)+x.meses[m].v;r.custo+=x.meses[m].v;});});
 r.lucro=r.receita-r.custo;r.marg=r.receita?r.lucro/r.receita:0;return r;}
function vDre(){
 const sel=DRESEL==='TODOS'?DATA:DATA.filter(a=>a.id===DRESEL);
 const mi=MESES.indexOf(MES);
 const mes=dreOf(sel,MES);
 const acc={receita:0,custo:0,lucro:0,linhas:{}};
 for(let i=0;i<=mi;i++){const d=dreOf(sel,MESES[i]);acc.receita+=d.receita;acc.custo+=d.custo;
  for(const k in d.linhas)acc.linhas[k]=(acc.linhas[k]||0)+d.linhas[k];}
 acc.lucro=acc.receita-acc.custo;acc.marg=acc.receita?acc.lucro/acc.receita:0;
 const cats=[...new Set(sel.flatMap(a=>a.custos.map(c=>c.nome)))];
 let h=`<h2 class="sec">DRE</h2><div class="seg">
  <button class="${DRESEL==='TODOS'?'on':''}" onclick="DRESEL='TODOS';render()">Consolidado</button>`+
  DATA.map(a=>`<button class="${DRESEL===a.id?'on':''}" onclick="DRESEL='${a.id}';render()">${esc(a.nome)}</button>`).join('')+
 `</div><div class="card"><table>
  <tr><th>Linha</th><th>${NOMES[MES]}</th><th>Acum. ano</th></tr>
  <tr><td>Receita bruta (aluguéis)</td><td class="g">${brl(mes.receita)}</td><td class="g">${brl(acc.receita)}</td></tr>`;
 cats.forEach(k=>{
  h+=`<tr class="sb"><td>(−) ${esc(k)}</td><td>${brl(mes.linhas[k]||0)}</td><td>${brl(acc.linhas[k]||0)}</td></tr>`;});
 h+=`<tr><td><b>Custo total</b></td><td class="r">${brl(mes.custo)}</td><td class="r">${brl(acc.custo)}</td></tr>
  <tr class="tot"><td>Lucro líquido</td><td class="${mes.lucro>=0?'g':'r'}">${brl(mes.lucro)}</td>
   <td class="${acc.lucro>=0?'g':'r'}">${brl(acc.lucro)}</td></tr>
  <tr class="sb"><td>Margem líquida</td><td>${(mes.marg*100).toFixed(1)}%</td><td>${(acc.marg*100).toFixed(1)}%</td></tr>
  </table></div>
  <p class="note">DRE por competência: considera tudo que foi lançado no mês, pago ou não. O regime de caixa (o que entrou e saiu de fato) está na aba Fluxo.</p>`;
 return h;
}

/* ---------- FLUXO ---------- */
function vFluxo(){
 const rows=MESES.map(m=>{const t=totStats(m);return{m,...t};});
 const ativos=rows.filter(r=>r.rec>0||r.cus>0);
 const max=Math.max(1,...ativos.map(r=>Math.max(r.recPg,r.cusPg)));
 let acc=0;
 let h=`<h2 class="sec">Fluxo de caixa · realizado</h2>
  <div class="card"><div class="chart">`+
  ativos.map(r=>`<div><b style="height:${r.recPg/max*55}%"></b><u style="height:${r.cusPg/max*55}%"></u></div>`).join('')+
  `</div><div class="chartx">`+ativos.map(r=>`<span>${r.m}</span>`).join('')+`</div>
  <table><tr><th>Mês</th><th>Entrou</th><th>Saiu</th><th>Saldo</th><th>Acum.</th></tr>`;
 ativos.forEach(r=>{acc+=r.caixa;
  h+=`<tr${r.m===MES?' style="background:var(--card2)"':''}><td>${r.m}</td><td class="g">${brl(r.recPg)}</td>
   <td class="r">${brl(r.cusPg)}</td><td class="${r.caixa>=0?'g':'r'}">${brl(r.caixa)}</td>
   <td class="b">${brl(acc)}</td></tr>`;});
 h+=`<tr class="tot"><td>Total</td><td class="g">${brl(ativos.reduce((s,r)=>s+r.recPg,0))}</td>
  <td class="r">${brl(ativos.reduce((s,r)=>s+r.cusPg,0))}</td><td class="${acc>=0?'g':'r'}">${brl(acc)}</td><td></td></tr></table></div>`;
 const pend=[];
 DATA.forEach((ap,ai)=>MESES.slice(0,MESES.indexOf(MES)+1).forEach(m=>{
  ap.quartos.forEach((q,qi)=>{const c=q.meses[m];const falta=c.v-pagoVal(c);if(falta>0.005)pend.push({t:'q',ai,i:qi,rec:true,ap:ap.nome,m,n:q.inquilino||q.quarto,v:falta});});
  ap.custos.forEach((x,ci)=>{const c=x.meses[m];const falta=c.v-pagoVal(c);if(falta>0.005)pend.push({t:'c',ai,i:ci,rec:false,ap:ap.nome,m,n:x.nome,v:falta});});}));
 h+=`<h2 class="sec">Pendências até ${NOMES[MES]}</h2><div class="card"><div class="rows">`;
 if(!pend.length)h+=`<div class="row"><div class="info"><div class="t m">Nada em aberto 🎉</div></div></div>`;
 pend.slice(0,80).forEach(p=>{h+=`<div class="row"><div class="info"><div class="t">${esc(p.n)}</div>
  <div class="d">${esc(p.ap)} · ${p.m}</div></div><div class="valro ${p.rec?'a':'r'}">${brl(p.v)}</div>
  <div class="pill" onclick="baixaPend('${p.t}',${p.ai},${p.i},'${p.m}',this)">${p.rec?'A RECEBER':'A PAGAR'}</div></div>`;});
 h+=`</div></div>`;
 return h;
}

/* ---------- backup ---------- */
function exportar(){
 const blob=new Blob([JSON.stringify(DATA)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='4cantos-backup.json';a.click();}
function importar(){
 const i=document.createElement('input');i.type='file';i.accept='.json';
 i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{DATA=JSON.parse(r.result);OPEN={};EDIT={};save();render();}catch(err){alert('Arquivo inválido');}};
  r.readAsText(f);};
 i.click();}

/* ---------- render ---------- */
function render(){
 document.getElementById('months').innerHTML=MESES.map(m=>
  `<div class="mchip ${m===MES?'on':''} ${hasData(m)?'':'fut'}" onclick="MES='${m}';render()">${m}</div>`).join('');
 const t=totStats(MES);
 const hs=document.getElementById('hdSaldo');
 hs.textContent=brl(t.caixa);hs.className=t.caixa>=0?'g':'r';
 document.getElementById('ctxLbl').textContent=NOMES[MES]+' de 2026';
 ['resumo','lanc','dre','fluxo'].forEach(v=>{
  const el=document.getElementById('v-'+v);
  if(v===VIEW){el.classList.remove('hidden');
   el.innerHTML=v==='resumo'?vResumo():v==='lanc'?vLanc():v==='dre'?vDre():vFluxo();}
  else el.classList.add('hidden');});
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
 const on=document.querySelector('.mchip.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;window.scrollTo(0,0);render();});
render();
boot();
</script>
